<div class="add-expense-modal__header">
  <h3>{{ dialogData.title ? dialogData.title : "Delete?" }}</h3>
  <button matIconButton (click)="dialogRef.close(false)">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <p>
    {{
      dialogData.message
        ? dialogData.message
        : "Are you sure you want to delete this item?"
    }}
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close(false)">{{ 'common.cancel' | translate }}</button>
  <button mat-button color="warn" (click)="confirm()">{{ 'common.confirm' | translate }}</button>
</mat-dialog-actions>
