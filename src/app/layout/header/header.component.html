<mat-toolbar>
  @if (viewportServiceService.isMobile()) {
    <div class="logo" (click)="menuClick.emit()">
      <mat-icon>menu</mat-icon>
    </div>
  }

  <span class="example-spacer"></span>
  <img [matMenuTriggerFor]="menu" class="avatar" [src]="avatarSrc()" alt="User avatar" />

  <mat-menu #menu="matMenu">
    <button routerLink="/profile" mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>{{ 'nav.profile' | translate }}</span>
    </button>
    <button (click)="logOut()" mat-menu-item>
      <mat-icon>input</mat-icon>
      <span>{{ 'nav.logout' | translate }}</span>
    </button>
  </mat-menu>
</mat-toolbar>
