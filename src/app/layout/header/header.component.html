<mat-toolbar>
  @if (viewportServiceService.isMobile()) {
    <div class="logo" (click)="menuClick.emit()">
      <mat-icon>account_balance_wallet</mat-icon>
    </div>
  }

  <span class="example-spacer"></span>
  <app-theme-toggle />
  <div [matMenuTriggerFor]="menu" class="avatar">
    <img [src]="avatarUrl()" alt="qq" />
  </div>

  <mat-menu #menu="matMenu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item>
      <mat-icon>input</mat-icon>
      <span>Log Out</span>
    </button>
  </mat-menu>
</mat-toolbar>
